# Version là nguồn duy nhất để tạo tag base và tag custom.
versions:
  icinga2: "2.16.5"
  icingadb: "1.5.1"
  icingadb_redis: "7.4.11"
  icingaweb2: "2.14.0"
  mariadb: "12.3.3"

# Prefix registry nguồn. Rỗng nghĩa là pull từ Docker Hub.
# Ví dụ Harbor proxy cache: "harbor.example.com/dockerhub"
source_registry: ""

# Registry/project nhận image custom. Không thêm http:// hoặc https://.
# Harbor hiện tại: "172.28.81.109/openstack.kolla/icinga"
target_registry: ""

# Namespace chỉ dùng để đặt tên image trên Docker daemon của build node khi target_registry để trống.
# Đây không phải registry/Harbor project và không cần tạo trước. Khi target_registry có giá trị, option
# này bị bỏ qua hoàn toàn. Push luôn bắt buộc có target_registry để tránh đẩy nhầm image local.
local_namespace: "icinga-local"
# Mặc định giữ nguyên tag version đã pin. Có thể đặt "-custom" toàn cục hoặc riêng từng image.
tag_suffix: ""
platform: ""                       # ví dụ "linux/amd64"
build_network: ""                  # ví dụ "host" nếu Docker daemon không có bridge
retries: 1                          # retry thêm 1 lần khi docker build/push lỗi mạng

# Tương tự docker_dir của Kolla: mỗi thư mục có cấu trúc <image>/Dockerfile.
# Image có file override sẽ dùng file ngoài package; image còn lại dùng Dockerfile mặc định.
# Khai nhiều thư mục thì thư mục sau cùng có file tương ứng sẽ thắng.
docker_dirs: []
# docker_dirs:
#   - "/etc/icinga-image-builder/dockerfiles"

# Danh mục image mà tool hỗ trợ build. Đây không phải cấu hình container của icinga-ansible.
# Với mỗi image:
#   enabled: false             bỏ qua image, kể cả khi gọi build không truyền tên image.
#   source_repository          repository của base image upstream.
#   target_name                tên repository của image sau khi build.
#   build_args                 build argument bổ sung cho Dockerfile; không đặt BASE_IMAGE ở đây.
#
# Công thức thực tế:
#   base   = [source_registry/]source_repository:versions.<image>
#   target = (target_registry hoặc local_namespace)/target_name:versions.<image>[tag_suffix]
#
# Các khóa tùy chọn dockerfile, context và tag_suffix dùng được cho mọi image. Cách custom
# thường dùng là khai docker_dirs ở trên; chỉ khai ba khóa này khi một image cần ngoại lệ riêng.
images:
  icinga2:
    enabled: true
    source_repository: "icinga/icinga2"
    target_name: "icinga2"
    build_args: {}
  icingadb:
    enabled: true
    source_repository: "icinga/icingadb"
    target_name: "icingadb"
    build_args: {}
  icingadb_redis:
    enabled: true
    source_repository: "redis"
    target_name: "icingadb-redis"
    build_args: {}
  icingaweb2:
    enabled: true
    source_repository: "icinga/icingaweb2"
    target_name: "icingaweb2"
    build_args: {}
  mariadb:
    enabled: true
    source_repository: "mariadb"
    target_name: "mariadb"
    build_args: {}
